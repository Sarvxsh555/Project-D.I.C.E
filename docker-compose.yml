services:
  postgres:
    image: postgres:16-alpine
    container_name: login-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: loginuser
      POSTGRES_PASSWORD: loginpass
      POSTGRES_DB: dealflow
    volumes:
      - dealflow_pg:/var/lib/postgresql/data
      - ./data-service/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loginuser -d dealflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  data-service:
    build: ./data-service
    ports:
      - "8093:8093"
    environment:
      PORT: 8093
      DATABASE_URL: postgres://loginuser:loginpass@host.docker.internal:5433/dealflow
      DATA_SERVICE_KEY: data-demo-key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: ./gateway
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      JWT_SECRET: dev-only-insecure-secret-change-me-at-least-32-bytes-long
      CORS_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:5173,http://localhost:5175
      REDIS_URL: redis://redis:6379
      SERVICE_LOGIN: http://host.docker.internal:8080
      SERVICE_QUOTATION: http://host.docker.internal:8082
      SERVICE_DEAL: http://host.docker.internal:8083
      SERVICE_GOVERNANCE: http://host.docker.internal:8084
      SERVICE_APPROVAL: http://host.docker.internal:8085
      SERVICE_NEGOTIATION: http://host.docker.internal:8086
      SERVICE_INVENTORY: http://host.docker.internal:8087
      SERVICE_FULFILLMENT: http://host.docker.internal:8088
      SERVICE_RECOMMENDATION: http://host.docker.internal:8089
      SERVICE_DEAL_HEALTH: http://host.docker.internal:8090
      SERVICE_BILLING: http://host.docker.internal:8091
      SERVICE_OEEG: http://host.docker.internal:8092
      SERVICE_DATA: http://data-service:8093
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - data-service

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - gateway

volumes:
  dealflow_pg:
