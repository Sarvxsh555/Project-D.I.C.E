# D.I.C.E local stack with MySQL 8.4 Server
#   cp .env.example .env && docker compose up --build
#
# Services:
#   mysql     :3306  — MySQL 8.4 database, dealflow360
#   backend   :8080  — Spring Boot API (Java 17)
#   frontend  :5173  — Vite dev server
#   oeeg      :8081  — Odoo event emulator
#
# OEEG only starts when you ask for it:
#   docker compose --profile emulator up

name: dice

services:
  mysql:
    image: mysql:8.4
    container_name: dice-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dealflow360}
      MYSQL_USER: ${MYSQL_USER:-dice}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dice}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: dice-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-dealflow360}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-dice}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-dice}
      DICE_SECURITY_JWT_SECRET: ${JWT_SECRET:-sample-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-compliance}
      DICE_SECURITY_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      DICE_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DICE_ODOO_ENABLED: ${ODOO_ENABLED:-false}
      DICE_ODOO_URL: ${ODOO_URL:-http://localhost:8069}
      DICE_ODOO_DB: ${ODOO_DB:-odoo}
      DICE_ODOO_USERNAME: ${ODOO_USERNAME:-admin}
      DICE_ODOO_API_KEY: ${ODOO_API_KEY:-}
      DICE_ODOO_WEBHOOK_SECRET: ${ODOO_WEBHOOK_SECRET:-dev-webhook-secret}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dice-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - /app/node_modules

  oeeg:
    build:
      context: ./oeeg
      dockerfile: Dockerfile
    container_name: dice-oeeg
    profiles: ["emulator"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      OEEG_TARGET_URL: ${OEEG_TARGET_URL:-http://backend:8080/api/webhooks/odoo}
      OEEG_WEBHOOK_SECRET: ${ODOO_WEBHOOK_SECRET:-dev-webhook-secret}
      OEEG_EMIT_DELAY_MS: ${OEEG_EMIT_DELAY_MS:-750}
    ports:
      - "${OEEG_PORT:-8081}:8081"

volumes:
  mysql-data:
