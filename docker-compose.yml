# D.I.C.E local stack.
#   cp .env.example .env && docker compose up --build
#
# Services:
#   postgres  :5432  — database, schema owned by Flyway (backend/src/main/resources/db/migration)
#   backend   :8080  — Spring Boot API
#   frontend  :5173  — Vite dev server (HMR, bind-mounted source)
#   oeeg      :8081  — Odoo event emulator; profile-gated, see below
#
# OEEG only starts when you ask for it:
#   docker compose --profile emulator up

name: dice

services:
  postgres:
    image: postgres:16-alpine
    container_name: dice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dice}
      POSTGRES_USER: ${POSTGRES_USER:-dice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dice}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -d/-U guard against the check passing against the bootstrap DB.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dice} -d ${POSTGRES_DB:-dice}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      # Root context so the image can pull in database/migrations + database/seed,
      # which Flyway loads from the classpath at db/migration.
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: dice-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dice}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dice}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dice}
      DICE_SECURITY_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DICE_SECURITY_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      DICE_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DICE_ODOO_ENABLED: ${ODOO_ENABLED:-false}
      DICE_ODOO_URL: ${ODOO_URL:-http://localhost:8069}
      DICE_ODOO_DB: ${ODOO_DB:-odoo}
      DICE_ODOO_USERNAME: ${ODOO_USERNAME:-admin}
      DICE_ODOO_API_KEY: ${ODOO_API_KEY:-}
      DICE_ODOO_WEBHOOK_SECRET: ${ODOO_WEBHOOK_SECRET:-dev-webhook-secret}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dice-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Browser-side calls go to the host-published backend port, not the
      # compose-internal hostname — the bundle runs outside the network.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      # Keeps the image's node_modules from being shadowed by the host.
      - /app/node_modules

  oeeg:
    build:
      context: ./oeeg
      dockerfile: Dockerfile
    container_name: dice-oeeg
    profiles: ["emulator"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      OEEG_TARGET_URL: ${OEEG_TARGET_URL:-http://backend:8080/api/webhooks/odoo}
      OEEG_WEBHOOK_SECRET: ${ODOO_WEBHOOK_SECRET:-dev-webhook-secret}
      OEEG_EMIT_DELAY_MS: ${OEEG_EMIT_DELAY_MS:-750}
    ports:
      - "${OEEG_PORT:-8081}:8081"

volumes:
  postgres-data:
