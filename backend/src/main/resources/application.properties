server.port=8080
spring.application.name=login

spring.datasource.url=jdbc:postgresql://localhost:5433/dealflow
spring.datasource.username=loginuser
spring.datasource.password=loginpass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

app.jwt.secret=change-this-demo-secret-key-please-32-bytes-min
app.jwt.access-expiration-minutes=15
app.jwt.refresh-expiration-days=7

# false for local http dev; set true once served over https in any real deployment
app.cookie.secure=false

app.mailer.base-url=http://localhost:4000
app.quotation-service.base-url=${QUOTATION_SERVICE_BASE_URL:http://localhost:8082/api}
app.frontend.base-url=http://localhost:5173
