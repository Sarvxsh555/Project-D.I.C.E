# Base configuration. Environment variables win over everything here —
# see .env.example for the full list.
spring:
  application:
    name: dice-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dice?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:dice}
    password: ${SPRING_DATASOURCE_PASSWORD:dice_local_pw}
    hikari:
      pool-name: dice-pool
      maximum-pool-size: 10

  jpa:
    # Flyway owns the schema. Hibernate must never touch it, or the two
    # disagree and the migrations stop being the source of truth.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        # MySQL has no native UUID column type. Hibernate's default for a
        # java.util.UUID field there is BINARY(16); every migration in this
        # port instead uses CHAR(36) (human-readable, matches what Postgres
        # produced), so tell Hibernate to match rather than rewrite every
        # @Id field's mapping.
        type:
          preferred_uuid_jdbc_type: CHAR

  flyway:
    enabled: true
    # Copied in from database/migrations at build time; see pom.xml.
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    # Dates as ISO-8601 rather than epoch millis is already Boot's default
    # in Jackson 3 (tools.jackson) — no override needed here.
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

dice:
  security:
    jwt:
      secret: ${DICE_SECURITY_JWT_SECRET:dev-only-insecure-secret-change-me-at-least-32-bytes-long}
      expiration-ms: ${DICE_SECURITY_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${DICE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  odoo:
    enabled: ${DICE_ODOO_ENABLED:false}
    url: ${DICE_ODOO_URL:http://localhost:8069}
    db: ${DICE_ODOO_DB:odoo}
    username: ${DICE_ODOO_USERNAME:admin}
    api-key: ${DICE_ODOO_API_KEY:}
    webhook-secret: ${DICE_ODOO_WEBHOOK_SECRET:dev-webhook-secret}

logging:
  level:
    com.dice: DEBUG

---
# Local development: seeded demo data and chattier SQL.
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

---
# Tests run against an in-memory H2 in MySQL mode, so no local MySQL server is
# needed for `mvn test`. Swap for Testcontainers when the SQL gets MySQL-specific.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:dice;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
