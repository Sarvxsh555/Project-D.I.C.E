spring:
  application:
    name: dice-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dealflow360?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: dice-pool
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

dice:
  security:
    jwt:
      secret: ${DICE_SECURITY_JWT_SECRET:dev-only-insecure-secret-change-me-at-least-32-bytes-long}
      expiration-ms: ${DICE_SECURITY_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${DICE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  odoo:
    enabled: ${DICE_ODOO_ENABLED:false}
    url: ${DICE_ODOO_URL:http://localhost:8069}
    db: ${DICE_ODOO_DB:odoo}
    username: ${DICE_ODOO_USERNAME:admin}
    api-key: ${DICE_ODOO_API_KEY:}
    webhook-secret: ${DICE_ODOO_WEBHOOK_SECRET:dev-webhook-secret}

logging:
  level:
    com.dice: INFO
