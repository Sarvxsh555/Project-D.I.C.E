worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 2m;
  client_body_timeout 10s;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Never retry POSTs / mutations onto another upstream.
  proxy_next_upstream off;
  proxy_http_version 1.1;

  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  limit_req_zone $binary_remote_addr zone=edge:10m rate=30r/s;

  upstream gateway {
    server gateway:8000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Request-ID $req_id always;

    # Prometheus scrapes the gateway internally — do not expose it on :80.
    location = /metrics {
      return 404;
    }

    location /api/ {
      limit_req zone=edge burst=60 nodelay;
      proxy_pass http://gateway;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $req_id;
      proxy_set_header Authorization $http_authorization;
      proxy_connect_timeout 2s;
      proxy_send_timeout 15s;
      proxy_read_timeout 15s;
    }

    location = /health {
      proxy_pass http://gateway;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Request-ID $req_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

    location /documentation {
      proxy_pass http://gateway;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Request-ID $req_id;
      proxy_read_timeout 15s;
    }

    location /assets/ {
      expires 7d;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
