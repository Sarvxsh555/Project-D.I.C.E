# Optional local Nginx (host install). Do not use this file inside Docker.
# Listen on :80 while Vite is on :5173 and the Fastify gateway is on :8000:
#
#   sudo nginx -c /absolute/path/to/dice/nginx/host.conf
#
# Feasible: TLS, gzip, one public origin.
# Not feasible here: JWT/RBAC/error envelopes — leave those on the gateway.

worker_processes auto;
error_log /tmp/dealflow-nginx-error.log warn;
pid /tmp/dealflow-nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 2m;
  proxy_next_upstream off;
  proxy_http_version 1.1;

  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  upstream vite {
    server 127.0.0.1:5173;
  }

  upstream gateway {
    server 127.0.0.1:8000;
  }

  server {
    listen 80 default_server;
    server_name localhost;

    add_header X-Request-ID $req_id always;

    location = /metrics {
      return 404;
    }

    location /api/ {
      proxy_pass http://gateway;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $req_id;
      proxy_set_header Authorization $http_authorization;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
    }

    location = /health {
      proxy_pass http://gateway;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Request-ID $req_id;
    }

    location /documentation {
      proxy_pass http://gateway;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Request-ID $req_id;
    }

    location / {
      proxy_pass http://vite;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Request-ID $req_id;
    }
  }
}
