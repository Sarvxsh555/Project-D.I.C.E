server.port=8082
spring.application.name=quotation-service

spring.datasource.url=jdbc:postgresql://localhost:5433/dealflow
spring.datasource.username=loginuser
spring.datasource.password=loginpass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Must match the login-service's app.jwt.secret so tokens issued there verify here.
app.jwt.secret=change-this-demo-secret-key-please-32-bytes-min

app.cors.allowed-origins=http://localhost:5173,http://localhost:5175

# Live Odoo JSON-RPC is off unless explicitly enabled. OEEG still posts emulated events
# to /api/webhooks/odoo so D.I.C.E. can react without a live Odoo instance.
dice.odoo.enabled=${DICE_ODOO_ENABLED:false}
dice.oeeg.webhook-key=${OEEG_WEBHOOK_KEY:oeeg-demo-key}

app.deal-engine.base-url=${DEAL_ENGINE_BASE_URL:http://localhost:8083/api}
