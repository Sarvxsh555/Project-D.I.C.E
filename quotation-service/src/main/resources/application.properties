server.port=8082
spring.application.name=quotation-service

spring.datasource.url=jdbc:postgresql://localhost:5433/quotationdb
spring.datasource.username=loginuser
spring.datasource.password=loginpass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Must match the login-service's app.jwt.secret so tokens issued there verify here.
app.jwt.secret=change-this-demo-secret-key-please-32-bytes-min

app.cors.allowed-origins=http://localhost:5173,http://localhost:5175
