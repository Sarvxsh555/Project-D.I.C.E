spring.application.name=dice-oeeg
server.port=8081

# Where OEEG posts generated/replayed events. In docker-compose this is the
# backend service name; on the host it's localhost.
dice.oeeg.target-url=${OEEG_TARGET_URL:http://localhost:8080/api/webhooks/odoo}
dice.oeeg.webhook-secret=${OEEG_WEBHOOK_SECRET:dev-webhook-secret}
dice.oeeg.emit-delay-ms=${OEEG_EMIT_DELAY_MS:750}
# Relative to the working directory: `oeeg/` under `mvn spring-boot:run`,
# `/app` in the Docker image (see oeeg/Dockerfile's COPY scenarios step).
dice.oeeg.scenarios-dir=${OEEG_SCENARIOS_DIR:scenarios}
